# TV Projetos: 2x NVIDIA Quadro P620 (PCI 1:0:0 e 2:0:0), 6 TVs LG SIGNAGE 1920x1080.
# Entregue pelo Scout em /setup/X11/xorg.conf.d/; o eLux copia para /etc/X11/xorg.conf.d no boot.
# Base Mosaic: uma única tela de 5760x2160 nas saídas das duas placas.
# Grade (MetaModes): placa 1 em cima, placa 2 embaixo, saídas DFP-1, DFP-5, DFP-7 da esquerda para a direita.

Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "TV-GPU0"
    Driver     "nvidia"
    BusID      "PCI:1:0:0"
    Option     "AllowEmptyInitialConfiguration" "On"
EndSection

Section "Screen"
    Identifier   "TV-Mosaic"
    Device       "TV-GPU0"
    DefaultDepth 24
    Option       "BaseMosaic" "True"
    Option       "MetaModes" "GPU-0.DFP-1: 1920x1080 +0+0, GPU-0.DFP-5: 1920x1080 +1920+0, GPU-0.DFP-7: 1920x1080 +3840+0, GPU-1.DFP-1: 1920x1080 +0+1080, GPU-1.DFP-5: 1920x1080 +1920+1080, GPU-1.DFP-7: 1920x1080 +3840+1080"
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "TV-Layout"
    Screen 0   "TV-Mosaic"
EndSection
